services:
  postgres:
    image: postgres:15-alpine
    container_name: nexaaudit-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: nexaaudit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nexaaudit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: